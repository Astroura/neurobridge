name: Test and build Mac apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview release tag, e.g. v0.6.0-preview'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm NeuroBridge.spec
      - run: dist/NeuroBridge.app/Contents/MacOS/NeuroBridge --self-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/NeuroBridge.app NeuroBridge-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-macOS-${{ matrix.arch }}
          path: NeuroBridge-macOS-${{ matrix.arch }}.zip
  stimuli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==21.0.0 soundfile==0.13.1 imageio-ffmpeg==0.6.0
      - run: python scripts/build_stimulus_pack.py
      - run: python scripts/build_stimulus_collections.py
      - run: python scripts/verify_stimulus_collections.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Pack-v1
          path: NeuroBridge-Stimulus-Pack-v1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Collections-v2
          path: stimulus-downloads/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: [build, stimuli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          name: 'NeuroBridge 0.6.0: live quality checks and fixed trial analysis'
          body: |
            Adds four live raw EEG traces with per-channel saturation, amplitude, flatness and timing warnings. Every new trial waits for ten continuous passing seconds and receives a 30-second quiet baseline. Failed baselines are logged and retried; persistent failure preserves partial EEG and stops the session.

            NB-QC-1 is saved and fingerprinted before recording. Primary paired spectral features require at least 70% accepted nonoverlapping 2-second epochs in each phase, ten baseline epochs and five listening epochs. Welch Hann PSDs use no overlap; theta/alpha/beta powers and baseline-normalized dB changes are averaged within a trial. Epochs/channels are not independent subjects. Old data applications are labelled retrospective. See QUALITY-PROTOCOL.md for the complete rule, fit instructions and limits.

            Fixed analysis runs automatically after a completed session. Review & clean shows eligibility and reasons, separate from older descriptive plots. Exports include quality_policy.json and quality_trials.csv. Raw EEG, answers and prior reports remain intact. Short clips still record but cannot meet the primary-analysis duration rule.

            Fixes the missing dynamic bitstring backend that crashed the packaged Bluetooth worker. Startup checks now import the Muse/Bleak path and decode a known Muse EEG packet.

            Download arm64 for Apple Silicon or x86_64 for Intel. The three human-voice stimulus packs are unchanged. Quit the older app before opening this build. Apps remain ad-hoc signed, not Apple-notarized. Quality thresholds are project-specific pilot screening criteria, not validated artifact detection or a comprehension classifier. A Muse hardware rehearsal is still required.
