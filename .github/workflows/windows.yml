name: Test and build Windows app
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/publish-*.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm NeuroBridge.spec
      - name: Packaged imports, Muse decoder, PNG/PDF/NumPy export checks
        shell: pwsh
        run: |
          & dist/NeuroBridge/NeuroBridge-Worker.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged self-test failed' }
      - name: Real packaged recording, safe stop and all audio formats
        run: python scripts/verify_windows_build.py dist/NeuroBridge
      - name: Package portable Windows download
        shell: pwsh
        run: |
          Copy-Item WINDOWS-START-HERE.txt dist/NeuroBridge/
          Copy-Item QUALITY-PROTOCOL.md dist/NeuroBridge/
          Copy-Item Start-Muse.cmd dist/NeuroBridge/
          Compress-Archive -Path dist/NeuroBridge -DestinationPath NeuroBridge-Windows10-x64.zip
          Get-FileHash NeuroBridge-Windows10-x64.zip -Algorithm SHA256 | Format-List | Out-File Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Windows10-x64
          path: |
            NeuroBridge-Windows10-x64.zip
            Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification
          path: windows-verification/
          if-no-files-found: ignore
