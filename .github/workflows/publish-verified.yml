name: Publish verified preview artifacts
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed successful Test and build Mac apps run ID'
        required: true
        type: string
      release_tag:
        description: 'New preview tag'
        required: true
        default: 'v0.5.1-preview'
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const repo = context.repo;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+-preview$/.test(process.env.RELEASE_TAG)) throw Error('Use a versioned preview tag');
            if (!/^[0-9]+$/.test(process.env.SOURCE_RUN)) throw Error('Invalid source run ID');
            const sourceRun=Number(process.env.SOURCE_RUN);
            const sources = [
              {run: sourceRun, name: 'NeuroBridge-macOS-arm64', job: 'build (macos-15, arm64)'},
              {run: sourceRun, name: 'NeuroBridge-macOS-x86_64', job: 'build (macos-15-intel, x86_64)'},
              {run: sourceRun, name: 'NeuroBridge-Stimulus-Collections-v2', job: 'stimuli'}
            ];
            fs.mkdirSync('verified', {recursive:true});
            for (const item of sources) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id:item.run});
              if (run.conclusion !== 'success' || run.path !== '.github/workflows/macos.yml') throw Error('Source must be a completed successful Mac build workflow');
              if (run.head_repository.full_name !== `${repo.owner}/${repo.repo}`) throw Error('Unexpected source repository');
              const comparison = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead:`${run.head_sha}...${context.sha}`});
              if (comparison.data.status !== 'ahead' && comparison.data.status !== 'identical') throw Error('Source is not an ancestor');
              // Reuse only when application/runtime files are unchanged. Packaging, user documentation and this publisher may differ.
              for (const file of comparison.data.files || []) {
                if (!(file.filename.startsWith('stimulus-materials/source/') || file.filename === 'scripts/build_stimulus_pack.py' || file.filename === '.github/workflows/publish-verified.yml' || file.filename === 'README.md')) {
                  throw Error(`Application source differs: ${file.filename}`);
                }
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id:item.run});
              if (!jobs.some(j => j.name === item.job && j.conclusion === 'success')) throw Error(`Build/test job did not pass: ${item.job}`);
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id:item.run});
              const artifact = artifacts.find(a => a.name === item.name && !a.expired);
              if (!artifact) throw Error(`Missing artifact: ${item.name}`);
              const archive = await github.rest.actions.downloadArtifact({...repo, artifact_id:artifact.id, archive_format:'zip'});
              const bytes = Buffer.from(archive.data);
              if (artifact.digest && artifact.digest !== 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex')) throw Error('Artifact digest mismatch');
              fs.writeFileSync(path.join('verified',item.name+'.artifact.zip'),bytes);
              core.info(`Verified ${item.name} from ${run.head_sha}`);
            }
      - run: |
          mkdir -p downloads
          for archive in verified/*.artifact.zip; do unzip -j "$archive" -d downloads; done
          test -s downloads/NeuroBridge-macOS-arm64.zip
          test -s downloads/NeuroBridge-macOS-x86_64.zip
          test -s downloads/NeuroBridge-English-Simple-v2.zip
          test -s downloads/NeuroBridge-Arabic-Simple-v2.zip
          test -s downloads/NeuroBridge-Hindi-English-Listening-v1.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: downloads/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          name: 'NeuroBridge 0.5.1: stimulus collections and listening-only sessions'
          body: |
            Adds three downloadable human-voice stimulus packs with transcripts, attribution, file hashes and per-clip review notes:
            - English Simple v2: 6 clips, two very simple English factual questions per clip.
            - Arabic Simple v2: 6 clips, two very simple English factual questions per clip. Formal written Arabic read by source-locale ar_eg speakers.
            - Hindi / English Listening v1: 8 clips forming four content pairs, with no questions, understanding rating or comprehension score.

            Import ZIPs in Session setup. Listening-only trials require this app version: they advance directly from playback to rest while preserving EEG and events. answers.csv records response_mode=none with blank response/score fields. Existing questionnaire trials keep their behavior.

            Sources: Google FLEURS, CC BY 4.0. Complete utterances, constant per-file level adjustment and PCM16 conversion; no speech synthesis. Review includes transcript/answer evidence proofreading, independent local machine transcription and file integrity checks, not direct auditory or fluent-speaker certification. See each pack's REVIEW.md. These are short pilot materials, not validated comprehension tests. For paired languages select one translation per subject or counterbalance repetition; ordering is randomized.

            Mac downloads: arm64 for Apple Silicon, x86_64 for Intel. Quit the older app first. Raw recordings and the chosen data folder are preserved. Apps remain ad-hoc signed and not Apple-notarized.
