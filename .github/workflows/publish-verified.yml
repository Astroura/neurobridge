name: Publish verified preview artifacts
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed successful Test and build Mac apps run ID'
        required: true
        type: string
      windows_run:
        description: 'Completed successful Test and build Windows app run ID'
        required: true
        type: string
      release_tag:
        description: 'New preview tag'
        required: true
        default: 'v0.7.0-preview'
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const repo = context.repo;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+-preview$/.test(process.env.RELEASE_TAG)) throw Error('Use a versioned preview tag');
            if (!/^[0-9]+$/.test(process.env.SOURCE_RUN)) throw Error('Invalid source run ID');
            if (!/^[0-9]+$/.test(process.env.WINDOWS_RUN)) throw Error('Invalid Windows run ID');
            const sourceRun=Number(process.env.SOURCE_RUN);
            const sources = [
              {run: sourceRun, name: 'NeuroBridge-macOS-arm64', job: 'build (macos-15, arm64)'},
              {run: sourceRun, name: 'NeuroBridge-macOS-x86_64', job: 'build (macos-15-intel, x86_64)'},
              {run: sourceRun, name: 'NeuroBridge-Stimulus-Collections-v2', job: 'stimuli'},
              {run: Number(process.env.WINDOWS_RUN), name: 'NeuroBridge-Windows10-x64', job: 'windows', workflow: '.github/workflows/windows.yml'}
            ];
            fs.mkdirSync('verified', {recursive:true});
            for (const item of sources) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id:item.run});
              if (run.conclusion !== 'success' || run.path !== (item.workflow || '.github/workflows/macos.yml')) throw Error('Source must be a completed successful Mac build workflow');
              if (run.head_repository.full_name !== `${repo.owner}/${repo.repo}`) throw Error('Unexpected source repository');
              const comparison = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead:`${run.head_sha}...${context.sha}`});
              if (comparison.data.status !== 'ahead' && comparison.data.status !== 'identical') throw Error('Source is not an ancestor');
              // Reuse only when application/runtime files are unchanged. Packaging, user documentation and this publisher may differ.
              for (const file of comparison.data.files || []) {
                if (!(file.filename.startsWith('stimulus-materials/source/') || file.filename === 'scripts/build_stimulus_pack.py' || file.filename === '.github/workflows/publish-verified.yml' || file.filename === 'README.md')) {
                  throw Error(`Application source differs: ${file.filename}`);
                }
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id:item.run});
              if (!jobs.some(j => j.name === item.job && j.conclusion === 'success')) throw Error(`Build/test job did not pass: ${item.job}`);
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id:item.run});
              const artifact = artifacts.find(a => a.name === item.name && !a.expired);
              if (!artifact) throw Error(`Missing artifact: ${item.name}`);
              const archive = await github.rest.actions.downloadArtifact({...repo, artifact_id:artifact.id, archive_format:'zip'});
              const bytes = Buffer.from(archive.data);
              if (artifact.digest && artifact.digest !== 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex')) throw Error('Artifact digest mismatch');
              fs.writeFileSync(path.join('verified',item.name+'.artifact.zip'),bytes);
              core.info(`Verified ${item.name} from ${run.head_sha}`);
            }
      - run: |
          mkdir -p downloads
          for archive in verified/*.artifact.zip; do unzip -j "$archive" -d downloads; done
          test -s downloads/NeuroBridge-Windows10-x64.zip
          test -s downloads/NeuroBridge-macOS-arm64.zip
          test -s downloads/NeuroBridge-macOS-x86_64.zip
          test -s downloads/NeuroBridge-English-Simple-v2.zip
          test -s downloads/NeuroBridge-Arabic-Simple-v2.zip
          test -s downloads/NeuroBridge-Hindi-English-Listening-v1.zip
          (cd downloads && sha256sum *.zip > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            downloads/*.zip
            downloads/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          name: 'NeuroBridge 0.7.0: Windows 10 and Mac'
          body: |
            Adds a portable Windows 10 x64 app with the same interface, stimulus imports, audio and live trials, questionnaires, listening-only mode, raw EEG, quality gates, per-trial baselines, fixed NB-QC-1 analysis, cleaning, scientific graphs, CSV/NumPy exports and chosen local save/export folders as the Mac app.

            Windows: extract the complete NeuroBridge-Windows10-x64.zip and open NeuroBridge.exe. Keep _internal and NeuroBridge-Worker.exe beside it. Python, MuseLSL and FFmpeg are bundled. Use Start Muse in console or the included Start-Muse.cmd, wait for Streaming EEG, then Start live check. Keep the console open; Control+C disconnects. In-app connection uses Bleak WinRT in a separate worker. Cooperative stop requests preserve partial CSVs and session metadata. WAV, MP3, AIFF/AIF and M4A are supported with bundled decoding and native Windows playback.

            Target: Windows 10 22H2 x64 with Bluetooth Low Energy, .NET Framework 4.8 and Microsoft Edge WebView2 Runtime. If WebView2 is missing, get Microsoft's Evergreen Runtime at https://developer.microsoft.com/microsoft-edge/webview2/. Read WINDOWS-START-HERE.txt in the ZIP. The Windows executable is unsigned; do not disable security protections if blocked.

            Mac: choose arm64 for Apple Silicon or x86_64 for Intel. The existing Terminal startup button and Cocoa playback are retained. Mac apps remain ad-hoc signed, not notarized. The three downloadable human-voice stimulus packs are unchanged and work on both platforms.

            All common tests and packaged import/Muse-decoder/PNG/PDF/NumPy checks pass on Windows, Apple Silicon and Intel build runners. Windows integration also verifies packaged decoding for all five audio extensions, a synthetic local LSL recording with graceful stop, and native WebView2 loading of Setup, Recordings and Review & clean. The Windows runner is Windows Server 2022, not a Windows 10 headset machine. Real Windows 10 Bluetooth, speaker/headphone output, native folder dialogs and full collection require a hardware rehearsal before study use. Audio markers bracket requests/returns, including Windows decoding, rather than measured acoustic onset.

            NB-QC-1 requires four passing channels, ten continuous passing seconds, and a 30-second baseline before each trial. Primary analysis requires at least 70% accepted 2-second epochs in both phases, at least ten baseline epochs and five listening epochs. Short clips still record but cannot enter that primary analysis. Rules are saved before recording; raw EEG stays intact. See QUALITY-PROTOCOL.md for details. Screening thresholds are project-specific pilot criteria, not validated artifact detection or a comprehension classifier. This is research preview software.
