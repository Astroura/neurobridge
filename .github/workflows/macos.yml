name: Test and build Mac apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview release tag, e.g. v0.3.0-preview'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm NeuroBridge.spec
      - run: dist/NeuroBridge.app/Contents/MacOS/NeuroBridge --self-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/NeuroBridge.app NeuroBridge-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-macOS-${{ matrix.arch }}
          path: NeuroBridge-macOS-${{ matrix.arch }}.zip
  stimuli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==21.0.0 soundfile==0.13.1 imageio-ffmpeg==0.6.0
      - run: python scripts/build_stimulus_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Pack-v1
          path: NeuroBridge-Stimulus-Pack-v1.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: [build, stimuli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          name: NeuroBridge 0.3.0 — guided setup & lilac UI
          body: |
            A redesigned muted lilac and gray interface guides you through workspace, trial selection, and final review.

            Import a stimulus ZIP, preview its contents, and select individual trials or audio/live groups before adding them. Compact trial cards show missing details/questions; the start checklist explains what remains. Save and reload setups, choose a local recording folder, and export EEG, answers, NumPy arrays, and scientific plots.

            Download the app for your Mac (arm64: Apple Silicon; x86_64: Intel) and the separate NeuroBridge-Stimulus-Pack-v1.zip. Import the pack in the app. It includes all six current practice audio clips, source/licensing notes and three draft paired English/Egyptian Arabic live stories with matching questions.

            Live mode: connect Muse, add a live conversation trial, enter language/speaker/script and two factual questions, then Start session. Operator marks Start speaking / Finish speaking; the subject completes the same 0–2 question score and 1–5 understanding rating. No microphone audio or EEG-based comprehension prediction is included. Operator markers are not acoustic-onset measurements.

            Practice pack is not a validated final study stimulus set. Recorded questions are blank pending review; fixed-time Arabic excerpts may cut sentences. Draft live translations need fluent-speaker review. Avoid giving the same subject both translations without a counterbalanced design.

            Both app builds pass automated tests, including bundled PNG/PDF/NumPy export checks. Full headset rehearsals remain necessary on each partner’s Mac. Apps are ad-hoc signed, not Apple-notarized; macOS may block opening them. Do not disable Gatekeeper. Source-run instructions are in README.md.
