name: Test and build Mac apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview release tag, e.g. v0.5.0-preview'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm NeuroBridge.spec
      - run: dist/NeuroBridge.app/Contents/MacOS/NeuroBridge --self-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/NeuroBridge.app NeuroBridge-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-macOS-${{ matrix.arch }}
          path: NeuroBridge-macOS-${{ matrix.arch }}.zip
  stimuli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==21.0.0 soundfile==0.13.1 imageio-ffmpeg==0.6.0
      - run: python scripts/build_stimulus_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Pack-v1
          path: NeuroBridge-Stimulus-Pack-v1.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: [build, stimuli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          name: 'NeuroBridge 0.5.0: notebook interface'
          body: |
            Research notebook and bench instrument UI, implemented from the approved DESIGN.md.

            Adds bundled IBM Plex Serif/Sans and Arabic fonts, local Lucide symbols, paper/graphite surfaces, teal actions, violet retained-data annotations, ruled asymmetric layouts, and responsive SVG figures. Setup, capture, graphs, cleaning and bilingual participant questions share one token system; scientific report styling uses the same source.

            Active capture keeps Stop and the timer visible. Participant view hides operator navigation, notes and filesystem paths. Import preview, saved setup, artifact exclusions, source fingerprints and local exports remain available. EEG processing thresholds, calculations, raw files and timing semantics are unchanged.

            Download arm64 for Apple Silicon or x86_64 for Intel. Quit the older app before opening this build. The separate stimulus pack is unchanged and contains practice materials requiring review. No validated comprehension classifier is included.

            Includes automated scientific, HTTP, offline-asset, export and packaged-app checks. UI review covers desktop/native and mobile layouts, errors, empty/loading/disabled states, Arabic, reduced motion, and zoom-equivalent rendering. See DESIGN.md and UI-REVIEW.md for the review and limits. Bluetooth/audio and native Save-dialog rehearsals still belong on each partner's Mac. Apps remain ad-hoc signed, not Apple-notarized.
