name: Test and build Mac apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview release tag, e.g. v0.5.1-preview'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm NeuroBridge.spec
      - run: dist/NeuroBridge.app/Contents/MacOS/NeuroBridge --self-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/NeuroBridge.app NeuroBridge-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-macOS-${{ matrix.arch }}
          path: NeuroBridge-macOS-${{ matrix.arch }}.zip
  stimuli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==21.0.0 soundfile==0.13.1 imageio-ffmpeg==0.6.0
      - run: python scripts/build_stimulus_pack.py
      - run: python scripts/build_stimulus_collections.py
      - run: python scripts/verify_stimulus_collections.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Pack-v1
          path: NeuroBridge-Stimulus-Pack-v1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge-Stimulus-Collections-v2
          path: stimulus-downloads/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: [build, stimuli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          name: 'NeuroBridge 0.5.1: stimulus collections and listening-only sessions'
          body: |
            Adds three downloadable human-voice stimulus packs with transcripts, attribution, file hashes and per-clip review notes:
            - English Simple v2: 6 clips, two very simple English factual questions per clip.
            - Arabic Simple v2: 6 clips, two very simple English factual questions per clip. Formal written Arabic read by source-locale ar_eg speakers.
            - Hindi / English Listening v1: 8 clips forming four content pairs, with no questions, understanding rating or comprehension score.

            Import ZIPs in Session setup. Listening-only trials require this app version: they advance directly from playback to rest while preserving EEG and events. answers.csv records response_mode=none with blank response/score fields. Existing questionnaire trials keep their behavior.

            Sources: Google FLEURS, CC BY 4.0. Complete utterances, constant per-file level adjustment and PCM16 conversion; no speech synthesis. Review includes transcript/answer evidence proofreading, independent local machine transcription and file integrity checks, not direct auditory or fluent-speaker certification. See each pack's REVIEW.md. These are short pilot materials, not validated comprehension tests. For paired languages select one translation per subject or counterbalance repetition; ordering is randomized.

            Mac downloads: arm64 for Apple Silicon, x86_64 for Intel. Quit the older app first. Raw recordings and the chosen data folder are preserved. Apps remain ad-hoc signed and not Apple-notarized.
